<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pop the balloons – NC Mobile ID card art – NC DMV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
  /* ---------- Colors ---------- */
  :root {
    --navy: #0B2A5B;      /* background */
    --gold: #FFC220;      /* hints, darts, buttons */
    --gold-deep: #E8A400;
    --red: #CE1126;       /* bunting */
    --cream: #F4F1EA;     /* bunting */
    --white: #FFFFFF;
    --muted: rgba(255,255,255,.66);
    --faint: rgba(255,255,255,.45);
    --slab: 'Alfa Slab One', Georgia, serif;
    --sans: 'Fira Sans', system-ui, sans-serif;
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--navy); color: var(--white); font-family: var(--sans); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  h1, h2, p, ol, ul, figure, figcaption { margin: 0; padding: 0; }
  ol, ul { list-style: none; }
  img { display: block; }
  a { color: var(--gold); }
  a:hover { color: var(--white); }
  button { appearance: none; border: 0; background: none; color: inherit; font: inherit; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  [hidden] { display: none !important; }
  .visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

  /* ---------- Fixed 1180×820 stage, scaled to fit the iPad ---------- */
  .viewport { position: fixed; inset: 0; overflow: hidden; }
  .stage { position: absolute; left: 50%; top: 50%; width: 1180px; height: 820px; transform: translate(-50%,-50%); transform-origin: 50% 50%; display: flex; flex-direction: column; overflow: hidden; background: var(--navy); }
  .bunting { flex: 0 0 16px; height: 16px; background: repeating-linear-gradient(90deg, var(--red) 0 34px, var(--cream) 34px 68px); }

  /* ---------- Header ---------- */
  .top { flex: 0 0 auto; padding: 20px 44px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 26px; }
  .eyebrow { font: 400 14px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.5); }
  .title { font: 400 38px/1.05 var(--slab); margin-top: 9px; }
  .hint { font: 400 19px/1 var(--sans); color: var(--gold); margin-top: 11px; }
  .rack { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .small-label { font: 400 13px/1.2 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
  .darts { display: flex; gap: 9px; }
  .dart { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #FFD866, var(--gold-deep)); transition: background .2s ease; }
  .dart.used { background: rgba(255,255,255,.1); border: 1px dashed rgba(255,255,255,.28); }

  /* ---------- Three cards with three balloons each ---------- */
  .slots { flex: 1; padding: 0 92px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px; align-content: start; }
  .slot { display: flex; flex-direction: column; }
  .slot.empty { visibility: hidden; }
  .sky { position: relative; height: 330px; }

  .balloon { position: absolute; left: 50%; width: 143px; height: 160.16px; border-radius: 50% 50% 47% 47%; }
  .balloon.popped { cursor: default; pointer-events: none; }
  .b0 { top: 102px; margin-left: -156.5px; z-index: 7; --tilt: -15deg; }
  .b1 { top: 31px; margin-left: -68.5px; z-index: 13; --tilt: -1deg; }
  .b2 { top: 112px; margin-left: 14.5px; z-index: 6; --tilt: 13deg; }
  .skin { position: absolute; inset: 0; border-radius: 50% 50% 47% 47%; transform-origin: 50% 125%; pointer-events: none;
    background: radial-gradient(circle at 33% 26%, rgba(255,255,255,.8), var(--hue) 45%, rgba(0,0,0,.4));
    box-shadow: 0 8px 18px rgba(0,0,0,.34), inset -5px -7px 14px rgba(0,0,0,.22);
    transform: rotate(var(--tilt)); transition: transform .3s cubic-bezier(.2,1.5,.5,1), opacity .26s ease;
    animation: bob 2.6s var(--delay) ease-in-out infinite; }
  .shine { position: absolute; left: 24%; top: 16%; width: 26%; height: 20%; border-radius: 50%; background: rgba(255,255,255,.45); }
  .string { position: absolute; left: 50%; top: 100%; width: 1px; transform-origin: top center; background: rgba(255,255,255,.3); transition: opacity .26s ease; pointer-events: none; }
  .b0 .string { height: 108.75px; transform: rotate(-51.4deg); }
  .b1 .string { height: 138.87px; transform: rotate(1.24deg); }
  .b2 .string { height: 103.64px; transform: rotate(56.08deg); }
  .balloon.popped .skin { transform: scale(1.6) rotate(var(--tilt)); opacity: 0; animation: none; }
  .balloon.popped .string { opacity: 0; }

  /* balloon colors: card 1, card 2, card 3 */
  .slot:nth-child(1) .b0 { --hue: #CE1126; --delay: 0s; }
  .slot:nth-child(1) .b1 { --hue: #FFC220; --delay: .3s; }
  .slot:nth-child(1) .b2 { --hue: #2A6FB8; --delay: .6s; }
  .slot:nth-child(2) .b0 { --hue: #E8763A; --delay: .9s; }
  .slot:nth-child(2) .b1 { --hue: #3F8F6B; --delay: 1.2s; }
  .slot:nth-child(2) .b2 { --hue: #B0447C; --delay: 0s; }
  .slot:nth-child(3) .b0 { --hue: #CE1126; --delay: .3s; }
  .slot:nth-child(3) .b1 { --hue: #FFC220; --delay: .6s; }
  .slot:nth-child(3) .b2 { --hue: #2A6FB8; --delay: .9s; }

  .burst { position: absolute; left: 50%; top: 46%; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; border: 16px solid rgba(255,255,255,.5); animation: burst .45s ease-out both; pointer-events: none; }
  .confetti { position: absolute; left: 50%; pointer-events: none; opacity: 0; animation: confetti-out var(--dur) cubic-bezier(.07,.72,.26,1) var(--del) forwards; }
  .confetti i { position: absolute; inset: 0; border-radius: 2px; animation: confetti-drop var(--dur) cubic-bezier(.42,0,.86,.5) var(--del) forwards; }
  .confetti.wide i { border-radius: 1px; }

  .card { position: relative; align-self: center; width: 100%; aspect-ratio: 1.586; border-radius: 14px; overflow: hidden; z-index: 1; box-shadow: 0 4px 10px rgba(0,0,0,.32); transition: box-shadow .25s ease, width .35s cubic-bezier(.3,1.4,.6,1); }
  .card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .card.voted { box-shadow: 0 0 0 4px var(--gold), 0 14px 28px rgba(0,0,0,.45); }
  .card:disabled { cursor: default; }
  .votes { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 6px; background: radial-gradient(circle at 35% 30%, #FFD866, var(--gold-deep)); color: #5b3d00; font: 400 16px/1 var(--slab); padding: 10px 15px; border-radius: 999px; box-shadow: 0 5px 12px rgba(0,0,0,.45); animation: pop .3s ease both; }
  .card-name { margin-top: 11px; text-align: center; font: 500 16px/1.3 var(--sans); color: var(--muted); }

  /* ---------- Footer ---------- */
  .bottom { flex: 0 0 auto; padding: 16px 44px 22px; display: flex; align-items: center; justify-content: space-between; gap: 22px; border-top: 1px solid rgba(255,255,255,.1); }
  .leaders { display: flex; align-items: center; gap: 14px; min-height: 62px; }
  .leaders .small-label { width: 70px; }
  .leader-list { display: flex; gap: 14px; }
  .leader { display: flex; align-items: center; gap: 9px; animation: pop .3s ease both; }
  .leader img { width: 92px; aspect-ratio: 1.586; object-fit: cover; border-radius: 7px; box-shadow: 0 4px 10px rgba(0,0,0,.35); }
  .leader-votes { font: 400 18px/1 var(--slab); color: var(--gold); }
  .actions { display: flex; gap: 12px; align-items: center; }
  .btn-quiet { font: 500 16px/1 var(--sans); color: var(--faint); border: 1px solid rgba(255,255,255,.2); padding: 15px 20px; border-radius: 999px; white-space: nowrap; }
  .btn-next { font: 700 18px/1 var(--sans); padding: 17px 28px; border-radius: 999px; white-space: nowrap; background: rgba(255,255,255,.1); color: rgba(255,255,255,.72); }
  .btn-next.ready, .btn-gold { background: var(--gold); color: var(--navy); }
  .btn-gold { font: 700 20px/1 var(--sans); padding: 20px 32px; border-radius: 999px; white-space: nowrap; }

  /* ---------- "All darts used" pop-up ---------- */
  .round-over { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .round-over-panel { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 34px 48px; border-radius: 24px; background: rgba(11,42,91,.93); box-shadow: 0 20px 50px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.14); animation: pop .3s ease both; }
  .round-over-text { font: 400 36px/1.1 var(--slab); text-align: center; }

  /* ---------- Final leaderboard ---------- */
  .results { position: absolute; left: 0; right: 0; top: 16px; bottom: 0; z-index: 50; background: var(--navy); display: flex; flex-direction: column; padding: 34px 60px 28px; }
  .results-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 26px; }
  .results-title { font: 400 40px/1.05 var(--slab); margin-top: 10px; }
  .results-body { flex: 1; display: grid; grid-template-columns: 400px 1fr; gap: 44px; align-items: start; padding-top: 28px; }
  .champ { display: flex; flex-direction: column; gap: 14px; }
  .champ-art { position: relative; width: 100%; aspect-ratio: 1.586; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 6px var(--gold), 0 18px 36px rgba(0,0,0,.5); }
  .champ-art img { width: 100%; height: 100%; object-fit: cover; }
  .ribbon { position: absolute; left: 14px; top: 14px; background: radial-gradient(circle at 35% 30%, #FFD866, var(--gold-deep)); color: #5b3d00; font: 400 16px/1 var(--slab); padding: 11px 16px; border-radius: 999px; box-shadow: 0 5px 12px rgba(0,0,0,.45); }
  .champ-name { display: block; font: 600 19px/1.3 var(--sans); }
  .champ-score { display: block; margin-top: 6px; font: 400 16px/1.3 var(--sans); color: rgba(255,255,255,.55); }
  .board { display: flex; flex-direction: column; gap: 12px; }
  .board-row { display: flex; align-items: center; gap: 16px; }
  .board-rank { font: 400 18px/1 var(--slab); color: rgba(255,255,255,.55); width: 30px; text-align: right; }
  .board-row img { width: 98px; aspect-ratio: 1.586; object-fit: cover; border-radius: 7px; box-shadow: 0 3px 8px rgba(0,0,0,.35); flex: none; }
  .board-main { flex: 1; min-width: 0; }
  .board-name { display: block; font: 500 16px/1.2 var(--sans); color: rgba(255,255,255,.88); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { display: block; margin-top: 7px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.1); }
  .bar-fill { display: block; height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--gold-deep)); }
  .board-votes { font: 400 17px/1 var(--slab); color: var(--gold); width: 28px; text-align: right; }

  /* ---------- Password screen ---------- */
  .lock { position: fixed; inset: 0; z-index: 9999; background: var(--navy); display: flex; align-items: center; justify-content: center; padding: 40px; -webkit-user-select: text; user-select: text; }
  .lock form { display: flex; flex-direction: column; gap: 20px; max-width: 460px; width: 100%; text-align: center; }
  .lock .bunting { flex: none; border-radius: 999px; background: repeating-linear-gradient(90deg, var(--red) 0 26px, var(--cream) 26px 52px); }
  .lock h1 { font: 400 34px/1.1 var(--slab); margin-top: 12px; }
  .lock p { font: 400 17px/1.5 var(--sans); color: var(--muted); }
  .lock input { margin-top: 6px; width: 100%; font: 400 19px/1 var(--sans); padding: 18px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: var(--white); text-align: center; letter-spacing: .08em; }
  .lock input::placeholder { color: rgba(255,255,255,.55); }
  .lock .error { font: 500 16px/1.4 var(--sans); color: #FF8A8A; }

  @keyframes pop { 0% { transform: scale(.86); opacity: 0 } 60% { transform: scale(1.04) } 100% { transform: scale(1); opacity: 1 } }
  @keyframes bob { 0%, 100% { transform: translateY(-4px) } 50% { transform: translateY(4px) } }
  @keyframes burst { 0% { transform: translate(-50%,-50%) scale(.5); opacity: .9; border-width: 14px } 100% { transform: translate(-50%,-50%) scale(2.1); opacity: 0; border-width: 2px } }
  @keyframes confetti-out { 0% { transform: translate(0,0); opacity: 0 } 7% { opacity: 1 } 100% { transform: translate(var(--bx), var(--by)); opacity: .92 } }
  @keyframes confetti-drop { 0% { transform: translateY(0) rotate(0deg) } 100% { transform: translateY(var(--cy)) rotate(var(--cr)) } }
  @media (prefers-reduced-motion: reduce) { .skin { animation: none; } .confetti { display: none; } }
</style>
</head>
<body>

<!--
  HOW TO EDIT
  • Any text you see on screen is in this file. Text that changes during the game lives in data-… attributes
    right on the element that shows it. {n}, {total}, {darts}, {Darts} and {name} are filled in by the game.
  • The cards are in the "deck" list near the bottom, grouped by subject. See the note there before renaming anything.
  • Game order: sets of three #1 designs → final round of the player's top three → pick the best version of their
    runner-up subject → pick the best version of their favorite subject.
  • Settings (sheet URL, password, number of darts) are at the top of the <script> at the bottom.
  • Lives at https://digital-solutions-development.github.io/mobile-id/state-fair/tablet/ — keep the cards/ folder next to this file.
-->

<div class="viewport">
  <main class="stage" id="stage" aria-labelledby="round-title">
    <div class="bunting" aria-hidden="true"></div>

    <header class="top">
      <div>
        <p class="eyebrow" id="set-label"
           data-set="Set {n} of {total}"
           data-final="Final round — your three favorites"
           data-refine2="Runner-up round · {row}"
           data-refine1="Blue ribbon round · {row}"
           data-done="Blue ribbon awarded"></p>
        <h1 class="title" id="round-title"
            data-sets="Pop the balloons over your favorite cards!"
            data-final="Final round: Choose among your favorites!"
            data-refine="Which {row} design do you like best?"></h1>
        <p class="hint" id="hint" role="status" aria-live="polite"
           data-start="Spend {darts} darts across these three however you like."
           data-final-start="These three won their rounds. {Darts} darts decide the ribbon."
           data-left="{n} darts left."
           data-left-one="1 dart left."
           data-out="Out of darts. Tap for the next three cards."
           data-final-out="Darts spent — now pick the best designs."
           data-refine-start="Three versions of {row}. {Darts} darts — pop the ones you like most."
           data-refine-out="Darts spent — tap to keep going."
           data-done="{name} takes the blue ribbon."></p>
      </div>
      <div class="rack" id="rack">
        <p class="small-label" id="darts-label">Darts left</p>
        <div class="darts" id="darts" role="img" aria-labelledby="darts-label"></div>
      </div>
    </header>

    <!-- data-balloon-label is what screen readers say for each balloon -->
    <ol class="slots" id="slots" data-balloon-label="Pop a balloon for {name}">
      <li class="slot">
        <div class="sky">
          <button type="button" class="balloon b0"><span class="skin"><span class="shine"></span></span><span class="string"></span></button>
          <button type="button" class="balloon b1"><span class="skin"><span class="shine"></span></span><span class="string"></span></button>
          <button type="button" class="balloon b2"><span class="skin"><span class="shine"></span></span><span class="string"></span></button>
        </div>
        <button type="button" class="card"><img alt=""><span class="votes" hidden></span></button>
        <p class="card-name"></p>
      </li>
      <li class="slot">
        <div class="sky">
          <button type="button" class="balloon b0"><span class="skin"><span class="shine"></span></span><span class="string"></span></button>
          <button type="button" class="balloon b1"><span class="skin"><span class="shine"></span></span><span class="string"></span></button>
          <button type="button" class="balloon b2"><span class="skin"><span class="shine"></span></span><span class="string"></span></button>
        </div>
        <button type="button" class="card"><img alt=""><span class="votes" hidden></span></button>
        <p class="card-name"></p>
      </li>
      <li class="slot">
        <div class="sky">
          <button type="button" class="balloon b0"><span class="skin"><span class="shine"></span></span><span class="string"></span></button>
          <button type="button" class="balloon b1"><span class="skin"><span class="shine"></span></span><span class="string"></span></button>
          <button type="button" class="balloon b2"><span class="skin"><span class="shine"></span></span><span class="string"></span></button>
        </div>
        <button type="button" class="card"><img alt=""><span class="votes" hidden></span></button>
        <p class="card-name"></p>
      </li>
    </ol>

    <footer class="bottom">
      <div class="leaders">
        <p class="small-label">Top so far</p>
        <ol class="leader-list" id="leaders"></ol>
      </div>
      <div class="actions">
        <button type="button" class="btn-quiet" id="restart">Start over</button>
        <button type="button" class="btn-next" id="next"
                data-next-set="Next three →"
                data-final="Final round →"
                data-refine2="Pick designs →"
                data-refine1="Last round →"
                data-crown="See my pick →"></button>
      </div>
    </footer>

    <div class="round-over" id="round-over" hidden>
      <div class="round-over-panel" role="dialog" aria-labelledby="round-over-text">
        <p class="round-over-text" id="round-over-text" data-text="All {darts} darts used!"></p>
        <!-- this button uses the same label as the Next button in the footer -->
        <button type="button" class="btn-gold" id="round-over-next"></button>
      </div>
    </div>

    <section class="results" id="results" aria-labelledby="results-title" hidden>
      <div class="results-head">
        <div>
          <p class="eyebrow">Final leaderboard</p>
          <h2 class="results-title" id="results-title" data-text="{row} takes the blue ribbon"></h2>
        </div>
        <button type="button" class="btn-gold" id="next-player">Next player →</button>
      </div>
      <div class="results-body">
        <figure class="champ">
          <div class="champ-art"><img id="champ-img" alt=""><span class="ribbon">1st</span></div>
          <figcaption>
            <strong class="champ-name" id="champ-name"></strong>
            <span class="champ-score" id="champ-score"
                  data-text="Your favorite version. Runner-up: {row2}, {design2}."></span>
          </figcaption>
        </figure>
        <ol class="board" id="board" aria-label="Runners-up"></ol>
      </div>
    </section>
  </main>
</div>

<!-- ======================= PASSWORD SCREEN ======================= -->
<section class="lock" id="lock" aria-labelledby="lock-title">
  <form id="lock-form">
    <div class="bunting" aria-hidden="true"></div>
    <h1 id="lock-title">NC mDL card art review</h1>
    <p>Enter the password to open the balloon game.</p>
    <label class="visually-hidden" for="pw">Password</label>
    <input type="password" id="pw" placeholder="Password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit" class="btn-gold">Enter →</button>
    <p class="error" id="pw-error" hidden>That password isn't right. Try again.</p>
  </form>
</section>

<!-- ======================= THE DECK ======================= -->
<!-- One <li> per subject. The FIRST image is the #1 design used in the opening rounds; the next two are its variations.
     data-row is the subject name and alt="" is the design name. The sheet saves them as "Subject · Design",
     so both must match BALLOON_ROWS in Code.gs exactly. -->
<ul id="deck" hidden>
  <li data-row="Blue Ridge Mountains"><img src="cards/blueridge-1.webp" alt="Gold poster"><img src="cards/blueridge-2.webp" alt="Teal &amp; coral"><img src="cards/blueridge-hot-sunset.webp" alt="Hot sunset"></li>
  <li data-row="Linn Cove Viaduct"><img src="cards/linncove-1.webp" alt="Red sun poster"><img src="cards/linncove-teal.webp" alt="Teal &amp; coral"><img src="cards/linncove-autumn-day.webp" alt="Clear autumn day"></li>
  <li data-row="Agriculture"><img src="cards/agriculture-1.webp" alt="Sunny farm"><img src="cards/agriculture-2.webp" alt="Pig &amp; bandana"><img src="cards/agriculture-vintage.webp" alt="Vintage print"></li>
  <li data-row="Barn Quilt"><img src="cards/barnquilt-1.webp" alt="Watercolor autumn"><img src="cards/barnquilt-2.webp" alt="Red sky"><img src="cards/barnquilt-navy-gold.webp" alt="Navy &amp; gold"></li>
  <li data-row="Coastal"><img src="cards/coastal-hatteras-blue.webp" alt="Hatteras blue"><img src="cards/coastal-1.webp" alt="Watercolor kites"><img src="cards/coastal-2.webp" alt="Red sky"></li>
  <li data-row="Cape Hatteras"><img src="cards/hatteras-1.webp" alt="Bold blue"><img src="cards/hatteras-2.webp" alt="Faded print"><img src="cards/hatteras-3.webp" alt="Teal poster"></li>
  <li data-row="Venus Fly Trap"><img src="cards/flytrap-4.webp" alt="Neon on black"><img src="cards/flytrap-1.webp" alt="Watercolor"><img src="cards/flytrap-2.webp" alt="Cosmic"></li>
  <li data-row="First in Flight"><img src="cards/flight-1.webp" alt="Sunburst"><img src="cards/flight-4.webp" alt="Clean sky"><img src="cards/flight-5.webp" alt="Sunset rays"></li>
  <li data-row="Bluegrass"><img src="cards/bluegrass-3.webp" alt="Banjo"><img src="cards/bluegrass-1.webp" alt="Porch band"><img src="cards/bluegrass-4.webp" alt="Fiddle on the porch"></li>
  <li data-row="Sweet Potatoes"><img src="cards/sweetpotato-1.webp" alt="Truck bed"><img src="cards/sweetpotato-3.webp" alt="Close-up"><img src="cards/sweetpotato-vintage.webp" alt="Vintage print"></li>
</ul>

<template id="leader-tpl"><li class="leader"><img alt=""><span class="leader-votes"></span></li></template>
<template id="board-tpl"><li class="board-row"><span class="board-rank"></span><img alt=""><span class="board-main"><span class="board-name"></span><span class="bar"><span class="bar-fill"></span></span></span><span class="board-votes"></span></li></template>

<script>
(function () {
  // ---------- Settings ----------
  var SHEET_URL = 'https://script.google.com/macros/s/AKfycbwvGXtYDzdJAM0dCPXz5zWIiuHFVIELJYgbDgFQSrKOMBsDzrMsPTXKeXa2ZqZoCMy0tg/exec';
  var TOKEN = 'ncmid-fair-2026';     // must match TOKEN in Code.gs
  var PASSWORD = 'firstinflight';    // not case-sensitive. This only keeps casual visitors out; it isn't real security.
  var DARTS = 5;                     // darts per set of three (must match BALLOON_DARTS in Code.gs)
  var FINAL_DARTS = 3;               // darts in the final round (must match FINAL_DARTS in Code.gs)
  var REFINE_DARTS = 3;              // darts in each "best version" round (must match REFINE_DARTS in Code.gs)
  var OUTBOX_KEY = 'mdl-balloon-outbox', DEVICE_KEY = 'mdl-balloon-device', GATE_KEY = 'mdl-gate';

  // ---------- Elements ----------
  function $(id) { return document.getElementById(id); }
  var stage = $('stage'), slotsEl = $('slots'), slots = slotsEl.querySelectorAll('.slot');
  var setLabel = $('set-label'), title = $('round-title'), hint = $('hint'), rack = $('rack'), dartsEl = $('darts');
  var nextBtn = $('next'), roundOver = $('round-over'), roundOverText = $('round-over-text'), roundOverBtn = $('round-over-next');
  var results = $('results'), leadersEl = $('leaders'), boardEl = $('board');
  var rows = Array.prototype.map.call(document.querySelectorAll('#deck li'), function (li) {
    var row = li.dataset.row;
    return { row: row, cards: Array.prototype.map.call(li.querySelectorAll('img'), function (img) {
      return { name: row + ' · ' + img.alt, row: row, label: img.alt, src: img.getAttribute('src') };
    }) };
  });
  var deck = [].concat.apply([], rows.map(function (r) { return r.cards; }));
  var primaries = rows.map(function (r) { return r.cards[0]; });

  // balloon positions (match the .b0/.b1/.b2 styles): sideways offset, lift from top, string drop
  var GEOM = [{ off: -85, top: 180.65, drop: 67.84 }, { off: 3, top: 109.65, drop: 138.84 }, { off: 86, top: 190.65, drop: 57.84 }];
  var WORDS = { 1: 'one', 2: 'two', 3: 'three', 4: 'four', 5: 'five', 6: 'six', 7: 'seven' };

  // ---------- Helpers ----------
  function fill(text, vars) { return String(text || '').replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; }); }
  function word(n) { return WORDS[n] || String(n); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function byName(n) { return deck.filter(function (c) { return c.name === n; })[0]; }
  function rowCards(row) { var r = rows.filter(function (x) { return x.row === row; })[0]; return r ? r.cards : []; }
  function isRefine() { return S.phase === 'refine2' || S.phase === 'refine1'; }
  function bestOf(log) { var b = log[0]; log.forEach(function (x) { if (x.darts > b.darts) b = x; }); return b; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function read(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; } }
  function write(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

  // ---------- Game state ----------
  var S;
  function makeSets() {
    var order = shuffle(primaries), out = [];
    for (var i = 0; i < order.length; i += 3) out.push(order.slice(i, i + 3));
    var last = out[out.length - 1];
    if (last && last.length < 3) {
      var pool = shuffle(order.filter(function (c) { return last.indexOf(c) < 0; }));
      while (last.length < 3 && pool.length) last.push(pool.shift());
    }
    return out;
  }
  function newGame() {
    S = { sets: makeSets(), set: 0, pops: [], tally: {}, finals: [], champ: '', phase: 'sets',
          startedAt: 0, setLog: [], finalLog: [], refineLog: [], second: '', fav: '', sent: false };
  }
  function current() {
    if (S.phase === 'sets') return S.sets[S.set] || [];
    if (S.phase === 'final') return S.finals.map(byName).filter(Boolean);
    if (S.phase === 'refine2') return rowCards(S.second);
    return rowCards(byName(S.champ).row);
  }
  function totalDarts() { return S.phase === 'sets' ? DARTS : S.phase === 'final' ? FINAL_DARTS : REFINE_DARTS; }
  function dartsLeft() { return S.phase === 'done' ? 0 : Math.max(0, totalDarts() - S.pops.length); }
  function votesFor(name) { return S.pops.filter(function (k) { return k.split('|')[0] === name; }).length; }
  function touch() { if (!S.startedAt) S.startedAt = Date.now(); }

  // ---------- Popping ----------
  function pop(ci, bi) {
    var card = current()[ci];
    if (!card || S.phase === 'done' || dartsLeft() === 0) return;
    var key = card.name + '|' + bi;
    if (S.pops.indexOf(key) > -1) return;
    touch();
    S.pops.push(key);
    var sky = slots[ci].querySelector('.sky'), balloon = sky.querySelectorAll('.balloon')[bi];
    balloon.classList.add('popped');
    var b = document.createElement('div'); b.className = 'burst'; balloon.appendChild(b);
    confetti(sky, ci * 3 + bi + S.set * 3, GEOM[bi]);
    update();
  }

  function confetti(sky, seed, g) {
    var tints = ['#FFC220', '#E8455F', '#4FC3F7', '#8BE38B', '#FFFFFF', '#C08BFF'], frag = document.createDocumentFragment();
    for (var i = 0; i < 54; i++) {
      var r = (seed * 37 + i * 61) % 100, wide = i % 3 === 0;
      var ang = (i / 54) * Math.PI * 2 + (r % 17) * 0.06, dist = 70 + ((r * 3 + i * 9) % 92);
      var dur = (1.1 + ((r * 3 + i * 7) % 60) / 100) + 's', del = (((r + i * 9) % 14) / 100) + 's';
      var o = document.createElement('span'), inner = document.createElement('i');
      o.className = 'confetti' + (wide ? ' wide' : '');
      o.style.cssText = 'top:' + g.top + 'px;width:' + (wide ? 10 : 6) + 'px;height:' + (wide ? 6 : 13) + 'px;margin-left:' + (g.off - 3) + 'px';
      o.style.setProperty('--bx', (Math.cos(ang) * dist).toFixed(1) + 'px');
      o.style.setProperty('--by', (Math.sin(ang) * dist * 0.55 - 22).toFixed(1) + 'px');
      o.style.setProperty('--dur', dur); o.style.setProperty('--del', del);
      inner.style.background = tints[i % tints.length];
      inner.style.setProperty('--cy', (g.drop + 96 + ((r * 5 + i * 11) % 96)) + 'px');
      inner.style.setProperty('--cr', (180 + (r % 5) * 160) + 'deg');
      inner.style.setProperty('--dur', dur); inner.style.setProperty('--del', del);
      o.appendChild(inner); frag.appendChild(o);
    }
    sky.appendChild(frag);
  }

  // ---------- Rounds ----------
  function next() {
    if (S.phase === 'done') { reset(); return; }
    touch();
    var set = current();
    var log = set.map(function (c) { return { card: c.name, darts: votesFor(c.name) }; });
    if (S.phase === 'final') {
      // rank the three finalists by final-round darts, then by darts from the opening sets
      S.finalLog = log;
      var ranked = log.slice().sort(function (a, b) { return (b.darts - a.darts) || ((S.tally[b.card] || 0) - (S.tally[a.card] || 0)); });
      S.champ = ranked[0].card; S.second = byName(ranked[1].card).row;
      S.phase = 'refine2'; S.pops = []; renderRound(); return;
    }
    if (S.phase === 'refine2') {
      S.refineLog.push({ row: S.second, cards: log, winner: bestOf(log).card });
      S.phase = 'refine1'; S.pops = []; renderRound(); return;
    }
    if (S.phase === 'refine1') {
      var w = bestOf(log).card;
      S.refineLog.push({ row: byName(S.champ).row, cards: log, winner: w });
      S.fav = w; S.phase = 'done'; S.pops = []; renderRound(); submit(); return;
    }
    S.pops.forEach(function (k) { var n = k.split('|')[0]; S.tally[n] = (S.tally[n] || 0) + 1; });
    S.setLog.push(log);
    S.pops = [];
    if (S.set + 1 >= S.sets.length) {
      var finals = Object.keys(S.tally).sort(function (a, b) { return S.tally[b] - S.tally[a]; }).slice(0, 3);
      shuffle(primaries).forEach(function (c) { if (finals.length < 3 && finals.indexOf(c.name) < 0) finals.push(c.name); });
      S.finals = finals; S.phase = 'final';
    } else {
      S.set += 1;
    }
    renderRound();
  }
  function reset() { newGame(); renderRound(); }

  // ---------- Drawing ----------
  function renderRound() {
    var set = current(), label = slotsEl.dataset.balloonLabel;
    slots.forEach(function (slot, ci) {
      var card = set[ci];
      slot.classList.toggle('empty', !card);
      slot.querySelectorAll('.confetti, .burst').forEach(function (el) { el.remove(); });
      slot.querySelectorAll('.balloon').forEach(function (b) {
        b.classList.remove('popped');
        b.setAttribute('aria-label', card ? fill(label, { name: card.name }) : '');
      });
      if (!card) return;
      var img = slot.querySelector('.card img');
      img.src = card.src; img.alt = card.name;
      slot.querySelector('.card-name').textContent = isRefine() ? card.label : card.row;
    });
    update();
  }

  function update() {
    var set = current(), total = totalDarts(), left = dartsLeft(), used = S.pops.length, done = S.phase === 'done';
    var lastSet = S.set + 1 >= S.sets.length;

    var champ = byName(S.champ), roundRow = set[0] ? set[0].row : '';
    setLabel.textContent = done ? setLabel.dataset.done
      : S.phase === 'final' ? setLabel.dataset.final
      : isRefine() ? fill(setLabel.dataset[S.phase], { row: roundRow })
      : fill(setLabel.dataset.set, { n: S.set + 1, total: S.sets.length });
    title.textContent = S.phase === 'sets' ? title.dataset.sets : isRefine() || done ? fill(title.dataset.refine, { row: roundRow }) : title.dataset.final;
    hint.textContent = done ? fill(hint.dataset.done, { name: champ ? champ.row : '' })
      : left === 0 ? (S.phase === 'final' ? hint.dataset.finalOut : isRefine() ? hint.dataset.refineOut : hint.dataset.out)
      : used === 0 ? (S.phase === 'final' ? fill(hint.dataset.finalStart, { Darts: cap(word(FINAL_DARTS)) })
                    : isRefine() ? fill(hint.dataset.refineStart, { row: roundRow, Darts: cap(word(REFINE_DARTS)) })
                    : fill(hint.dataset.start, { darts: word(DARTS) }))
      : left === 1 ? hint.dataset.leftOne : fill(hint.dataset.left, { n: left });

    rack.hidden = done;
    dartsEl.innerHTML = '';
    for (var i = 0; i < total; i++) {
      var d = document.createElement('span'); d.className = 'dart' + (i < used ? ' used' : ''); dartsEl.appendChild(d);
    }
    dartsEl.setAttribute('aria-label', left + ' of ' + total);

    slots.forEach(function (slot, ci) {
      var card = set[ci]; if (!card) return;
      var votes = votesFor(card.name), balloons = slot.querySelectorAll('.balloon');
      var nextB = -1;
      balloons.forEach(function (b, bi) {
        var popped = S.pops.indexOf(card.name + '|' + bi) > -1;
        if (!popped && nextB < 0) nextB = bi;
        if (left === 0) b.classList.add('popped');
        b.disabled = b.classList.contains('popped') || done;
      });
      var cardBtn = slot.querySelector('.card'), badge = cardBtn.querySelector('.votes');
      cardBtn.dataset.nextBalloon = nextB;
      cardBtn.disabled = nextB < 0 || left === 0 || done;
      cardBtn.setAttribute('aria-label', fill(slotsEl.dataset.balloonLabel, { name: card.name }) + (votes ? ' (' + votes + ' so far)' : ''));
      cardBtn.classList.toggle('voted', votes > 0);
      cardBtn.style.width = (100 + Math.min(votes, 6) * 3.2) + '%';
      cardBtn.style.zIndex = 1 + votes;
      badge.hidden = votes === 0;
      badge.textContent = votes;
    });

    leadersEl.innerHTML = '';
    Object.keys(S.tally).sort(function (a, b) { return S.tally[b] - S.tally[a]; }).slice(0, 4).forEach(function (n) {
      var li = $('leader-tpl').content.firstElementChild.cloneNode(true), c = byName(n);
      li.querySelector('img').src = c.src; li.querySelector('img').alt = c.row;
      li.querySelector('.leader-votes').textContent = S.tally[n];
      leadersEl.appendChild(li);
    });

    nextBtn.textContent = S.phase === 'refine1' ? nextBtn.dataset.crown : S.phase === 'refine2' ? nextBtn.dataset.refine1
      : S.phase === 'final' ? nextBtn.dataset.refine2 : lastSet ? nextBtn.dataset.final : nextBtn.dataset.nextSet;
    nextBtn.classList.toggle('ready', left === 0);

    roundOver.hidden = !(left === 0 && !done);
    roundOverText.textContent = fill(roundOverText.dataset.text, { darts: word(total) });
    roundOverBtn.textContent = nextBtn.textContent;

    results.hidden = !done;
    if (done) renderResults(champ);
  }

  function renderResults(champ) {
    var fav = byName(S.fav) || champ, champVotes = champ ? (S.tally[champ.name] || 0) : 0;
    var r2 = S.refineLog[0], second = r2 ? byName(r2.winner) : null;
    $('results-title').textContent = fill($('results-title').dataset.text, { row: fav ? fav.row : '' });
    $('champ-img').src = fav ? fav.src : ''; $('champ-img').alt = fav ? fav.name : '';
    $('champ-name').textContent = fav ? fav.label : '';
    var sc = $('champ-score'); sc.textContent = fill(sc.dataset.text, { row2: second ? second.row : '', design2: second ? second.label : '' });
    var ranked = Object.keys(S.tally).filter(function (n) { return !champ || n !== champ.name; })
      .sort(function (a, b) { return S.tally[b] - S.tally[a]; }).slice(0, 6);
    var max = Math.max(1, champVotes, ranked.length ? S.tally[ranked[0]] : 0);
    boardEl.innerHTML = '';
    ranked.forEach(function (n, i) {
      var li = $('board-tpl').content.firstElementChild.cloneNode(true), c = byName(n);
      li.querySelector('.board-rank').textContent = i + 2;
      li.querySelector('img').src = c.src; li.querySelector('img').alt = '';
      li.querySelector('.board-name').textContent = c.row;
      li.querySelector('.bar-fill').style.width = Math.max(6, (S.tally[n] / max) * 100) + '%';
      li.querySelector('.board-votes').textContent = S.tally[n];
      boardEl.appendChild(li);
    });
  }

  // ---------- Sending to the sheet (keeps trying if the tent Wi-Fi drops) ----------
  function deviceId() {
    try {
      var d = localStorage.getItem(DEVICE_KEY);
      if (!d) { d = 'k-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem(DEVICE_KEY, d); }
      return d;
    } catch (e) { return 'no-storage'; }
  }

  function submit() {
    if (S.sent) return;
    S.sent = true;
    var rec = {
      app: 'balloon-ipad', v: 1, k: TOKEN,
      id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2),
      at: new Date().toISOString(),
      sets: S.setLog, finals: S.finalLog, champion: S.champ, refine: S.refineLog, favorite: S.fav,
      device: deviceId(),
      secs: S.startedAt ? Math.round((Date.now() - S.startedAt) / 1000) : null,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
      lang: navigator.language || '', ua: (navigator.userAgent || '').slice(0, 300),
      screen: screen.width + 'x' + screen.height, touch: navigator.maxTouchPoints || 0,
      webdriver: !!navigator.webdriver, standalone: !!navigator.standalone, geo: geo
    };
    write(OUTBOX_KEY, read(OUTBOX_KEY, []).concat(rec));
    flush();
  }

  var flushing = false;
  function flush() {
    var pending = read(OUTBOX_KEY, []);
    if (!SHEET_URL || flushing || !pending.length) return;
    flushing = true;
    Promise.all(pending.map(function (rec) {
      return fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(rec) })
        .then(function () { return rec.id; }, function () { return null; });
    })).then(function (sent) {
      write(OUTBOX_KEY, read(OUTBOX_KEY, []).filter(function (r) { return sent.indexOf(r.id) < 0; }));
      flushing = false;
      if (read(OUTBOX_KEY, []).length) setTimeout(flush, 30000);
    });
  }

  // ---------- Approximate location (used to flag out-of-state submissions) ----------
  var geo = null;
  function loadGeo() {
    try { var g = sessionStorage.getItem('mdl-geo'); if (g) { geo = JSON.parse(g); return; } } catch (e) {}
    function timeout(p, ms) { return Promise.race([p, new Promise(function (_, rej) { setTimeout(rej, ms); })]); }
    timeout(fetch('https://ipwho.is/?fields=success,country_code,region,city').then(function (r) { return r.json(); }), 5000)
      .then(function (j) { return j && j.success ? { country: j.country_code, region: j.region, city: j.city } : Promise.reject(); })
      .catch(function () {
        return timeout(fetch('https://ipapi.co/json/').then(function (r) { return r.json(); }), 5000)
          .then(function (j) { return j && !j.error ? { country: j.country_code, region: j.region, city: j.city } : null; });
      })
      .then(function (g) { if (g) { geo = g; try { sessionStorage.setItem('mdl-geo', JSON.stringify(g)); } catch (e) {} } }, function () {});
  }

  // ---------- Password ----------
  function setupLock() {
    var open = false;
    try { open = sessionStorage.getItem(GATE_KEY) === 'ok'; } catch (e) {}
    $('lock').hidden = open;
    $('lock-form').addEventListener('submit', function (e) {
      e.preventDefault();
      if ($('pw').value.trim().toLowerCase() === PASSWORD) {
        try { sessionStorage.setItem(GATE_KEY, 'ok'); } catch (e2) {}
        $('pw').value = ''; $('pw-error').hidden = true; $('lock').hidden = true;
      } else {
        $('pw-error').hidden = false;
      }
    });
  }

  // ---------- Fit the stage to the screen ----------
  function fit() {
    var s = Math.min(window.innerWidth / 1180, window.innerHeight / 820);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }

  // ---------- Wire up ----------
  slots.forEach(function (slot, ci) {
    slot.querySelectorAll('.balloon').forEach(function (b, bi) { b.addEventListener('click', function () { pop(ci, bi); }); });
    slot.querySelector('.card').addEventListener('click', function () {
      var bi = parseInt(this.dataset.nextBalloon, 10); if (bi >= 0) pop(ci, bi);
    });
  });
  nextBtn.addEventListener('click', next);
  roundOverBtn.addEventListener('click', next);
  $('restart').addEventListener('click', reset);
  $('next-player').addEventListener('click', reset);
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  window.addEventListener('online', flush);

  setupLock();
  fit();
  newGame();
  renderRound();
  flush();
  loadGeo();
})();
</script>
</body>
</html>
